name: desktop-linux

# Builds the Linux x64 desktop packages (AppImage, deb, rpm) and runs the
# artifact gate. Deliberately NOT triggered by pull_request: the build fetches
# and executes upstream BentoPDF code (npm install and vite build), which must
# never run on untrusted PR code. Signing and release publishing are out of
# scope here (no secrets are used).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'packaging/**'
      - 'scripts/**'
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: desktop-linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install rpm tooling (rpmbuild for the .rpm, rpm2cpio/cpio for the gate)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rpm cpio

      - name: Lint shell scripts
        run: shellcheck -S warning scripts/*.sh packaging/*.sh packaging/flatpak/*.sh packaging/linux/AppRun

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Lint and unit tests (no Electron e2e)
        working-directory: desktop
        run: |
          npm run lint
          node --test --test-concurrency=1 test/open-file.test.js test/ipc.test.js test/security.test.js test/headers.test.js test/static-files.test.js test/transport-http.test.js

      - name: Build packages (builds the offline bundle first when dist/ is missing)
        run: bash scripts/package-linux.sh

      - name: Verify artifacts
        run: |
          for f in desktop/release/*.AppImage desktop/release/*.deb desktop/release/*.rpm; do
            bash packaging/verify-artifact.sh "$f"
          done

      - name: Checksums
        working-directory: desktop/release
        run: sha256sum ./*.AppImage ./*.deb ./*.rpm | tee SHA256SUMS

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bentopdf-native-linux-x64
          path: |
            desktop/release/*.AppImage
            desktop/release/*.deb
            desktop/release/*.rpm
            desktop/release/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
