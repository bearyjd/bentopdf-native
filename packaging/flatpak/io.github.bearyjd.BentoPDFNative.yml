# Flatpak for BentoPDF Native (unofficial). Local build, not submitted to Flathub.
# Build: packaging/flatpak/build-flatpak.sh  (needs desktop/release/linux-unpacked from
# scripts/package-linux.sh). Sandbox: Chromium's sub-sandbox runs through zypak from the
# Electron BaseApp; the app is NEVER started with --no-sandbox.
app-id: io.github.bearyjd.BentoPDFNative
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '25.08'
command: bentopdf-native
separate-locales: false
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # PDFs reach the app through the file chooser portal or file forwarding
  # (document portal paths). No --filesystem, and no --share=network: the
  # app has no network access at all, matching its offline design.
  - --file-forwarding
modules:
  - name: bentopdf-native
    buildsystem: simple
    build-commands:
      - mkdir -p /app/lib/bentopdf-native
      - cp -a linux-unpacked/. /app/lib/bentopdf-native/
      # zypak provides the sandbox in Flatpak; the setuid helper is unused and unusable there.
      - rm -f /app/lib/bentopdf-native/chrome-sandbox
      - install -Dm755 bentopdf-native.sh /app/bin/bentopdf-native
      - install -Dm644 io.github.bearyjd.BentoPDFNative.desktop /app/share/applications/io.github.bearyjd.BentoPDFNative.desktop
      - install -Dm644 io.github.bearyjd.BentoPDFNative.metainfo.xml /app/share/metainfo/io.github.bearyjd.BentoPDFNative.metainfo.xml
      - install -Dm644 icon-512.png /app/share/icons/hicolor/512x512/apps/io.github.bearyjd.BentoPDFNative.png
    sources:
      - type: dir
        path: ../../desktop/release/linux-unpacked
        dest: linux-unpacked
      - type: file
        path: bentopdf-native.sh
      - type: file
        path: io.github.bearyjd.BentoPDFNative.desktop
      - type: file
        path: io.github.bearyjd.BentoPDFNative.metainfo.xml
      - type: file
        path: ../icons/512x512.png
        dest-filename: icon-512.png
